<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesa Crypto | Makala na Habari za Crypto</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header -->
    <header class="navbar">
        <div class="logo">Pesa<span>Crypto</span></div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Tafuta makala au crypto...">
        </div>
    </header>

    <!-- Main Container -->
    <main class="container">
        
        <!-- Live Crypto Ticker / Highlights -->
        <section class="crypto-ticker" id="cryptoTicker">
            <p>Inapakia bei za crypto...</p>
        </section>

        <!-- Dynamic Articles Section -->
        <section class="content-section">
            <h2>Makala za Hivi Karibuni</h2>
            <div class="articles-grid" id="articlesGrid">
                <!-- Dynamic Content huingia hapa via JS -->
            </div>
        </section>

        <!-- Live World Crypto News -->
        <section class="content-section">
            <h2>Habari za Crypto Duniani</h2>
            <div class="news-grid" id="newsGrid">
                <!-- Live News API Data huingia hapa -->
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Pesa Crypto. Haki zote zimehifadhiwa.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
